<!doctype html>
<html class="no-js" lang="zxx" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title th:text="${Post.Title}"></title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="\assets\img\favicon.png" />

    <!-- all css here -->
    <link rel="stylesheet" href="\assets\css\bootstrap.min.css" />
    <link rel="stylesheet" href="\assets\css\plugin.css" />
    <link rel="stylesheet" href="\assets\css\bundle.css" />
    <link rel="stylesheet" href="\assets\css\style.css" />
    <link rel="stylesheet" href="\assets\css\responsive.css" />
    <script src="\assets\js\vendor\modernizr-2.8.3.min.js"></script>
    <style>
        .blog_entry_content {
            background-color: #f9f9f9; /* Màu nền nhẹ nhàng */
            padding: 20px; /* Khoảng cách bên trong */
            border-radius: 8px; /* Bo góc */
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Hiệu ứng đổ bóng */
            line-height: 1.8; /* Tăng khoảng cách dòng */
            font-size: 16px; /* Kích thước chữ */
            color: #333; /* Màu chữ dễ đọc */
        }
        
        .blog_entry_content p {
            margin-bottom: 16px; /* Khoảng cách giữa các đoạn văn */
            text-align: justify; /* Căn đều hai bên */
        }
        
        .blog_entry_content p:first-child {
            font-weight: bold; /* Làm nổi bật đoạn văn đầu tiên */
            font-size: 18px; /* Tăng kích thước chữ đoạn đầu */
            color: #007BFF; /* Màu chữ nổi bật */
        }
        
        .blog_entry_content p:last-child {
            font-style: italic; /* Làm nghiêng đoạn cuối */
            color: #555; /* Màu chữ nhạt hơn */
        }
        
        /* Hiệu ứng hover */
        .blog_entry_content:hover {
            background-color: #fff; /* Thay đổi màu nền khi hover */
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.15); /* Hiệu ứng đổ bóng khi hover */
        }
        
    </style>
</head>

<body>
    <!-- Add your site or application content here -->

    <!--pos page start-->
    <div class="pos_page">
        <div class="container">
            <!--pos page inner-->
            <div class="pos_page_inner">
                <!--header area -->
                <div th:replace="~{layout/header :: header}"></div>
                <!--header end -->
                <!--breadcrumbs area start-->
                <div class="breadcrumbs_area">
                    <div class="row">
                        <div class="col-12">
                            <div class="breadcrumb_content">
                                <ul>
                                    <li><a href="/">Trang chủ</a></li>
                                    <li><i class="fa fa-angle-right"></i></li>
                                    <li th:text="${Post.Title}"></li>
                                </ul>

                            </div>
                        </div>
                    </div>
                </div>
                <!--breadcrumbs area end-->

                <!--blog area start-->
                <div class="main_blog_area blog_details">
                    <div class="row">
                        <div class="col-lg-12 col-md-12">
                            <div class="blog_details_left">
                                <div class="blog_gallery">
                                    <div class="blog_header">
                                        <span>
                                            <!-- <a href="#">WordPress</a> -->
                                        </span>
                                        <!-- <h2><a href="#">Post with Gallery</a></h2> -->
                                        <div class="blog__post">
                                            <ul>
                                                <li class="post_author">Đăng bởi : admin</li>
                                                <li class="post_date" th:utext="${#dates.format(Post.CreatedDate, 'dd/MM/yyyy')}"></li>
                                            </ul>
                                        </div>
                                    </div>

                                    <div class="blog_entry_content">
                                        <div th:utext="${Post.Description}"></div>
                                        <div th:utext="${Post.Contents}"></div>
                                    </div>
                                  
                                </div>
                               

                            </div>
                        </div>
                    </div>
                </div>
                <!--blog area end-->

            </div>
            <!--pos page inner end-->
        </div>
    </div>
    <!--pos page end-->

    <!--footer area start-->
    <div th:replace="~{layout/footer :: footer}"></div>
    <!--footer area end-->






    <!-- all js here -->
    <script src="\assets\js\vendor\jquery-1.12.0.min.js"></script>
    <script src="\assets\js\popper.js"></script>
    <script src="\assets\js\bootstrap.min.js"></script>
    <script src="\assets\js\ajax-mail.js"></script>
    <script src="\assets\js\plugins.js"></script>
    <script src="\assets\js\main.js"></script>
</body>

</html>
