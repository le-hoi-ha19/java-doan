<header th:layout="header" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
  <div class="header_area">
    <!--header top-->
    <div class="header_top">
      <div class="row align-items-center">
        <div class="col-lg-6 col-md-6">
          <div class="switcher">
            <ul>
              
            <!-- 
              <li class="currency">
                <a href="#"> Currency : $ <i class="fa fa-angle-down"></i></a>
                <ul class="dropdown_currency">
                  <li><a href="#"> Dollar (USD)</a></li>
                  <li><a href="#"> Euro (EUR) </a></li>
                </ul>
              </li> -->
            </ul>
          </div>
        </div>
        <div class="col-lg-6 col-md-6">
          <div class="header_links">
            <ul>
              <!--<li>
                <a href="wishlist.html" title="wishlist">Sản phẩm yêu thích</a>
              </li>
              <li>
                <a href="my-account.html" title="My account">Tài khoản </a>
              </li>
              <li><a href="/cart" title="My cart">Giỏ hàng</a></li> -->
              <ul>
                <ul>
                  <!-- Hiển thị khi CHƯA đăng nhập -->
                  <li class="login-box" sec:authorize="!isAuthenticated()">
                    <select class="selectpicker show-tick form-control" onchange="if(this.value) location = this.value;">
                      <option value="" selected disabled>👤 Tài khoản</option>
                      <option value="/login">🔑 Đăng nhập</option>
                      <option value="/register">📝 Đăng ký</option>
                    </select>
                  </li>
                  
                  <!-- Hiển thị khi ĐÃ đăng nhập -->
                  <li class="login-box" sec:authorize="isAuthenticated()">
                    <select class="selectpicker show-tick form-control" onchange="if(this.value) location = this.value;">
                      <option value="" selected disabled sec:authentication="name" th:text="'👤 ' + ${#authentication.name}"></option>
                      <option value="/admin" sec:authorize="hasAuthority('ADMIN')">⚙️ Quản trị</option>
                      <option value="/my-orders" sec:authorize="isAuthenticated()">📦 Đơn hàng của tôi</option>
                      <option value="/logout">🚪 Đăng xuất</option>
                    </select>
                  </li>
                </ul>
              </ul>
            </ul>
          </div>
        </div>
      </div>
    </div>
    <!--header top end-->

    <!--header middel-->
    <div class="header_middel">
      <div class="row align-items-center">
        <!--logo start-->
        <div class="col-lg-3 col-md-3">
          <div class="logo">
            <a href="/"><img src="\assets\img\logo\logo.jpg.png" alt="" /></a>
          </div>
        </div>
        <!--logo end-->
        <div class="col-lg-9 col-md-9">
          <div class="header_right_info">
            <div class="search_bar">
              <form action="#">
                <input placeholder="Tìm kiếm...." type="text" />
                <button type="submit">
                  <i class="fa fa-search"></i>
                </button>
              </form>
            </div>
            <!-- Notification Bell -->
            <div class="notification_bell" sec:authorize="isAuthenticated()" style="display: inline-block; margin: 0 15px; position: relative;">
              <a href="/user/notifications" style="color: #333; font-size: 20px; position: relative;">
                <i class="fa fa-bell"></i>
                <span id="notification-badge" style="position: absolute; top: -8px; right: -10px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 11px; font-weight: bold; display: none;">0</span>
              </a>
            </div>
            <div class="shopping_cart">
              <a href="/cart">
                <i class="fa fa-shopping-cart" th:text = "${session.totalItem == null} ? ' 0 ' : ${session.totalItem}"></i>
                
              </a>

              
            </div>
          </div>
        </div>
      </div>
    </div>
    <!--header middel end-->
    <div class="header_bottom">
      <div class="row">
        <div class="col-12">
          <div class="main_menu_inner">
            <div class="main_menu d-none d-lg-block">
              <nav>
                <ul>
                  <li>
                    <a href="/">Trang chủ</a>
                  </li>
                  <li>
                    <a href="/products">Sản phẩm</a>
                  </li>
                  <li>
                    <a href="#">Danh mục</a>
                    <div class="mega_menu jewelry">
                      <div class="mega_items jewelry" th:each="category : ${categories}">
                        <ul>
                          <li>
                            <a th:href="@{'/products-category/' + ${category.slug}}" th:text="${category.CatName}"></a>
                          </li>
                        </ul>
                      </div>
                    </div>
                  </li>
                  <li>
                    <a href="#">Thương hiệu</a>
                    <div class="mega_menu jewelry">
                      <div class="mega_items jewelry" th:each="brand : ${listBra}">
                        <ul>
                          <li>
                            <a th:href="@{'/products-branch/' + ${brand.slug}}" th:text="${brand.BrandName}"></a>
                          </li>
                        </ul>
                      </div>
                    </div>
                  </li>

                  <li>
                    <a href="/blog">Tin tức</a>
                  </li>
                  <li><a href="/contact">Liên hệ</a></li>
                </ul>
              </nav>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  
  <!-- Notification Counter Script -->
  <script sec:authorize="isAuthenticated()">
    function updateNotificationCount() {
      fetch('/user/notifications/count')
        .then(response => response.json())
        .then(data => {
          const badge = document.getElementById('notification-badge');
          if (data.count > 0) {
            badge.textContent = data.count > 99 ? '99+' : data.count;
            badge.style.display = 'block';
          } else {
            badge.style.display = 'none';
          }
        })
        .catch(error => console.error('Error fetching notification count:', error));
    }
    
    // Update on page load
    document.addEventListener('DOMContentLoaded', updateNotificationCount);
    
    // Auto-refresh every 30 seconds
    setInterval(updateNotificationCount, 30000);
  </script>
</header>
