
<header id="header" class="header fixed-top d-flex align-items-center" th:fragment="header">

  <div class="d-flex align-items-center justify-content-between">
    <a href="/admin/" class="logo d-flex align-items-center">
      <img src="assets/img/logo.png" alt="">
      <span class="d-none d-lg-block">Trang quản trị</span>
    </a>
    <i class="bi bi-list toggle-sidebar-btn"></i>
  </div><!-- End Logo -->

  <nav class="header-nav ms-auto">
    <ul class="d-flex align-items-center">

      <!-- Notification Icon (Bell) -->
      <li class="nav-item dropdown pe-3">
        <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown" id="notification-bell">
          <i class="bi bi-bell" style="font-size: 1.5rem;"></i> <!-- Chuông thông báo -->
          <span class="badge bg-danger" id="notification-badge">0</span>
        </a><!-- End Notification Icon -->

        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow" style="width:300px;height:300px; background-color:white">
          <li class="dropdown-header">
            <h6>Thông báo</h6>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <!-- Hiển thị thông báo chưa đọc -->
          <li id="notification-list">
            <!-- Thông báo sẽ được thêm ở đây thông qua JavaScript -->
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <a class="dropdown-item d-flex align-items-center" style="text-align:center,display:block" href="#">Xem tất cả</a>
          </li>
        </ul><!-- End Notification Dropdown -->
      </li><!-- End Notification Nav -->

      <li class="nav-item dropdown pe-3">
        <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
          <img src="/admun/assets/img/profile-img.jpg" alt="Profile" class="rounded-circle">
          <span class="d-none d-md-block dropdown-toggle ps-2">Xin chào <span th:text="${#authentication.name}"></span></span>
        </a><!-- End Profile Iamge Icon -->

        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
          <li class="dropdown-header">
            <h6><span sec:authentication="name"></span></h6>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>

          <li>
            <a class="dropdown-item d-flex align-items-center" th:href="@{/logout}">
              <i class="bi bi-box-arrow-right"></i>
              <span>Đăng xuất</span>
            </a>
          </li>

        </ul><!-- End Profile Dropdown Items -->
      </li><!-- End Profile Nav -->

    </ul>
  </nav><!-- End Icons Navigation -->

</header><!-- End Header -->
