
<header id="header" class="header fixed-top d-flex align-items-center" th:fragment="header">

  <div class="d-flex align-items-center justify-content-between">
    <a href="/admin/" class="logo d-flex align-items-center">
      <img src="assets/img/logo.png" alt="">
      <span class="d-none d-lg-block">Trang quản trị</span>
    </a>
    <i class="bi bi-list toggle-sidebar-btn"></i>
  </div><!-- End Logo -->

  <nav class="header-nav ms-auto">
    <ul class="d-flex align-items-center">

      <!-- Notification Icon (Bell) -->
      <li class="nav-item dropdown pe-3">
        <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown" id="notification-bell">
          <i class="bi bi-bell" style="font-size: 1.5rem;"></i> <!-- Chuông thông báo -->
          <span class="badge bg-danger" id="notification-badge">0</span>
        </a><!-- End Notification Icon -->

        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow" style="width:300px;height:300px; background-color:white">
          <li class="dropdown-header">
            <h6>Thông báo</h6>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <!-- Hiển thị thông báo chưa đọc -->
          <li id="notification-list">
            <!-- Thông báo sẽ được thêm ở đây thông qua JavaScript -->
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li>
            <a class="dropdown-item d-flex align-items-center" style="text-align: center; display: block;" href="/admin/notifications">Xem tất cả</a>
          </li>
        </ul><!-- End Notification Dropdown -->
      </li><!-- End Notification Nav -->

      <li class="nav-item dropdown pe-3">
        <a class="nav-link nav-profile d-flex align-items-center pe-0" href="#" data-bs-toggle="dropdown">
          <img src="/admun/assets/img/profile-img.jpg" alt="Profile" class="rounded-circle">
          <span class="d-none d-md-block dropdown-toggle ps-2">Xin chào <span th:text="${#authentication.name}"></span></span>
        </a><!-- End Profile Iamge Icon -->

        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-arrow profile">
          <li class="dropdown-header">
            <h6><span sec:authentication="name"></span></h6>
          </li>
          <li>
            <hr class="dropdown-divider">
          </li>

          <li>
            <a class="dropdown-item d-flex align-items-center" th:href="@{/logout}">
              <i class="bi bi-box-arrow-right"></i>
              <span>Đăng xuất</span>
            </a>
          </li>

        </ul><!-- End Profile Dropdown Items -->
      </li><!-- End Profile Nav -->

    </ul>
  </nav><!-- End Icons Navigation -->

</header><!-- End Header -->

<!-- Admin Notification Script -->
<script>
  function updateAdminNotificationCount() {
    fetch('/admin/notifications/count')
      .then(response => response.json())
      .then(data => {
        const badge = document.getElementById('notification-badge');
        if (data.count > 0) {
          badge.textContent = data.count > 99 ? '99+' : data.count;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      })
      .catch(error => console.error('Error fetching admin notification count:', error));
  }

  function loadAdminNotifications() {
    fetch('/admin/notifications/unread')
      .then(response => response.json())
      .then(notifications => {
        const notificationList = document.getElementById('notification-list');
        if (notifications.length === 0) {
          notificationList.innerHTML = '<li class="dropdown-item text-center text-muted">Không có thông báo mới</li>';
        } else {
          notificationList.innerHTML = notifications.map(notif => `
            <li class="dropdown-item" style="cursor: pointer; white-space: normal;" onclick="markNotificationRead(${notif.id})">
              <div>
                <strong>${notif.title}</strong>
                <p class="mb-0 small">${notif.message}</p>
                <small class="text-muted">${new Date(notif.createdAt).toLocaleString('vi-VN')}</small>
              </div>
            </li>
            <hr class="dropdown-divider">
          `).join('');
        }
      })
      .catch(error => console.error('Error loading notifications:', error));
  }

  function markNotificationRead(notifId) {
    fetch(`/admin/notifications/${notifId}/mark-read`, {
      method: 'POST'
    })
    .then(response => response.json())
    .then(data => {
      if (data.success) {
        updateAdminNotificationCount();
        loadAdminNotifications();
      }
    });
  }

  // Load on page load
  document.addEventListener('DOMContentLoaded', () => {
    updateAdminNotificationCount();
  });

  // Reload when bell icon clicked
  document.getElementById('notification-bell').addEventListener('click', () => {
    loadAdminNotifications();
  });

  // Auto-refresh every 30 seconds
  setInterval(updateAdminNotificationCount, 30000);
</script>
